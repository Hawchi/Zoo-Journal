<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Onze reiskaart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map{height:100%;margin:0}body{background:#dfe7d7;font-family:system-ui,sans-serif}
    .leaflet-container{background:#dfe7d7;font-family:system-ui,sans-serif}.leaflet-tile{filter:saturate(.55) sepia(.14) brightness(1.08)}
    .zoo-pin{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;border:3px solid #fffaf1;box-shadow:0 3px 9px #513c2c55;background:#fffaf1;overflow:hidden}.zoo-pin img{display:block;width:34px;height:34px;object-fit:contain}.zoo-pin.visited{box-shadow:0 0 0 3px #df8f7b,0 3px 9px #513c2c55}.zoo-pin.wish{box-shadow:0 0 0 3px #d9aa55,0 3px 9px #513c2c55}.zoo-pin.neutral{opacity:.92}
    .leaflet-popup-content-wrapper{border-radius:17px;background:#fffaf1;color:#4f4237;box-shadow:0 10px 28px #513c2c38}.leaflet-popup-tip{background:#fffaf1}.leaflet-popup-content{width:235px!important;margin:16px}
    .popup-name{font:700 17px Georgia,serif;margin-bottom:3px}.popup-type{color:#8b7969;font-size:10px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.45px}.popup-price{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;min-height:55px;margin-bottom:10px;padding:10px 11px;border:1px solid #ced7c1;border-radius:12px;background:#edf1e5}.popup-price small{display:block;color:#718068;font-size:8px;font-weight:900;letter-spacing:.45px;text-transform:uppercase}.popup-price strong{grid-row:1/3;grid-column:2;font:700 17px Georgia,serif;color:#4f6048;white-space:nowrap}.popup-price span{color:#746b60;font-size:10px}.popup-price a{grid-column:1/-1;display:inline-flex;margin-top:5px;color:#5a6c51;font-size:9px;font-weight:900;text-decoration:none}.popup-price.loading{display:block;background:linear-gradient(90deg,#edf1e5 25%,#f6f4eb 50%,#edf1e5 75%);background-size:200% 100%;animation:mapPricePulse 1.2s infinite;color:#78836f;font-size:10px}.popup-price.unavailable{display:block;background:#f5eee4;border-color:#ddcfbd}.popup-price.unavailable strong{display:block;font:700 13px Georgia,serif;color:#62564a;margin-bottom:3px}.popup-price.unavailable a{display:inline-flex}@keyframes mapPricePulse{to{background-position:-200% 0}}.popup-actions{display:flex;gap:6px}.popup-actions button{flex:1;border:1px solid #cdbda8;background:#fff8eb;color:#665548;border-radius:9px;padding:7px 6px;font-size:9px;font-weight:750;cursor:pointer}.popup-actions button.active{background:#829574;color:#fff;border-color:#829574}
    .map-filter-shell{position:absolute;z-index:1000;left:12px;right:58px;top:12px;display:grid;grid-template-columns:30px minmax(0,1fr) 30px;align-items:center;gap:3px;padding:4px;border:1px solid #d7cab7;border-radius:18px;background:#fffaf1ed;box-shadow:0 5px 18px #513c2c22;backdrop-filter:blur(10px);pointer-events:auto}
    .map-filters{min-width:0;display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch}.map-filters::-webkit-scrollbar{display:none}.map-filters button{flex:0 0 auto;scroll-snap-align:center;border:1px solid #d6c8b2;background:#fffaf1;color:#65564a;border-radius:999px;min-height:34px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}.map-filters button.active{background:#718269;color:#fff;border-color:#718269}.map-filter-divider{flex:0 0 1px;width:1px;height:24px;background:#baa98f;opacity:.6}
    .map-filter-scroll{width:30px;height:34px;display:grid;place-items:center;border:0;border-radius:12px;background:#ece6d8;color:#5f5549;font:800 22px/1 Georgia,serif;cursor:pointer}.map-filter-scroll:disabled{opacity:.28;cursor:default}.map-filter-scroll:focus-visible,.map-filters button:focus-visible{outline:3px solid #d8876c;outline-offset:1px}
    @media(max-width:600px){.map-filter-shell{left:7px;right:7px;top:7px;grid-template-columns:32px minmax(0,1fr) 32px;padding:4px 3px}.map-filters{gap:5px}.map-filters button{white-space:nowrap;min-height:34px;padding:6px 10px;font-size:10px}.map-filter-scroll{width:32px}.leaflet-top.leaflet-left{top:49px}}
  </style>
</head>
<body><div id="map"></div><div class="map-filter-shell"><button class="map-filter-scroll previous" type="button" aria-label="Vorige filters">‹</button><div class="map-filters" aria-label="Kaartfilters" tabindex="0"><button class="active" data-kind="all">Alles</button><button data-kind="zoo">Dierentuinen</button><button data-kind="animal-park">Dierenparken</button><button data-kind="aquarium">Aquariums</button><button data-kind="petting-zoo">Kinderboerderijen</button><span class="map-filter-divider" aria-hidden="true"></span><button data-status="wish">Verlanglijst</button><button data-status="visited">Bezocht</button></div><button class="map-filter-scroll next" type="button" aria-label="Volgende filters">›</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
  const map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([51.2,7.0],5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  let places=[
    {id:'burgers',name:'Burgers’ Zoo',lat:51.985,lng:5.900,category:'zoo'},
    {id:'gaia',name:'GaiaZOO',lat:50.866,lng:6.045,category:'zoo'},
    {id:'blijdorp',name:'Diergaarde Blijdorp',lat:51.927,lng:4.449,category:'zoo'},
    {id:'apenheul',name:'Apenheul',lat:52.216,lng:5.921,category:'zoo'},
    {id:'antwerpen',name:'ZOO Antwerpen',lat:51.216,lng:4.421,category:'zoo'},
    {id:'pairi',name:'Pairi Daiza',lat:50.584,lng:3.887,category:'zoo'},
    {id:'leipzig',name:'Zoo Leipzig',lat:51.349,lng:12.373,category:'zoo'},
    {id:'berlin',name:'Zoo Berlin',lat:52.508,lng:13.337,category:'zoo'}
  ];
  let wishes=['pairi','apenheul'],visitedIds=['burgers','gaia','blijdorp'],activeKind='all',activeStatus='all';
  let layers=[];const priceCache=new Map();
  const safe=(value)=>String(value).replace(/[&<>'"]/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
  const safeLink=(value)=>{try{const url=new URL(value,location.origin);return ['http:','https:'].includes(url.protocol)?safe(url.href):''}catch{return ''}};
  const tomorrow=()=>{const date=new Date();date.setDate(date.getDate()+1);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`};
  const money=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
  const priceNodeId=(id)=>`map-price-${String(id).replace(/[^a-zA-Z0-9_-]/g,'')}`;
  const adultPrice=(prices)=>prices.find(item=>/(volwassen|adult|erwachsene|vanaf 10|vanaf 12|vanaf 13)/i.test(item.label)&&item.amount>0)||prices.find(item=>item.amount>0);
  const priceAmount=(item)=>item.qualifier==='range'&&item.maxAmount!=null?`${money.format(item.amount)} – ${money.format(item.maxAmount)}`:item.qualifier==='from'?`vanaf ${money.format(item.amount)}`:money.format(item.amount);
  const stateFor=(id)=>visitedIds.includes(id)?'visited':wishes.includes(id)?'wish':'neutral';
  const iconFile=(category)=>category==='aquarium'?'aquarium':category==='petting-zoo'?'petting-zoo':'zoo';
  const typeLabel=(category)=>category==='aquarium'?'Aquarium':category==='petting-zoo'?'Kinderboerderij':category==='animal-park'?'Dierenpark':'Dierentuin';
  const icon=(state,category)=>L.divIcon({className:'',html:`<div class="zoo-pin ${state}"><img src="/map-icons/${iconFile(category)}.png" alt=""></div>`,iconSize:[42,42],iconAnchor:[21,38]});
  function popup(place){const wished=wishes.includes(place.id),visited=visitedIds.includes(place.id);return `<div class="popup-name">${safe(place.name)}</div><div class="popup-type">${typeLabel(place.category)}</div><div class="popup-price loading" id="${priceNodeId(place.id)}">Actuele prijs ophalen…</div><div class="popup-actions"><button class="${wished?'active':''}" onclick="zooAction('${safe(place.id)}','wish')">${wished?'♥ Verlanglijst':'♡ Verlanglijst'}</button><button class="${visited?'active':''}" onclick="zooAction('${safe(place.id)}','visited')">${visited?'Bezoekgegevens':'Bezoek registreren'}</button></div>`}
  function renderPrice(node,payload,place){
    const item=adultPrice(payload?.prices||[]);const booking=safeLink(payload?.bookingUrl||place.website||'');
    if(item){const precision=payload.precision==='exact-date'?'Morgen · exacte prijs':item.qualifier==='range'?'Officieel prijsbereik':item.qualifier==='from'?'Actuele vanafprijs':'Actueel officieel tarief';node.className='popup-price';node.innerHTML=`<div><small>${precision}</small><span>${safe(item.label)}</span></div><strong>${safe(priceAmount(item))}</strong>${booking?`<a href="${booking}" target="_blank" rel="noreferrer">Bekijk beschikbaarheid en tickets</a>`:''}`;return}
    node.className='popup-price unavailable';node.innerHTML=`<strong>Prijs in officiële kalender</strong><span>Voor deze plek tonen we geen gegokt bedrag.</span>${booking?`<a href="${booking}" target="_blank" rel="noreferrer">Open officiële ticketpagina</a>`:''}`;
  }
  async function loadMapPrice(place){const node=document.getElementById(priceNodeId(place.id));if(!node)return;const key=`${place.id}-${tomorrow()}`;if(priceCache.has(key)){renderPrice(node,priceCache.get(key),place);return}try{const response=await fetch(`/api/prices?zooId=${encodeURIComponent(place.id)}&date=${tomorrow()}`,{cache:'no-store'});if(!response.ok){renderPrice(node,null,place);return}const payload=await response.json();priceCache.set(key,payload);renderPrice(node,payload,place)}catch{renderPrice(node,null,place)}}
  function isVisible(place){const typeMatches=activeKind==='all'||place.category===activeKind;const statusMatches=activeStatus==='all'||(activeStatus==='wish'&&wishes.includes(place.id))||(activeStatus==='visited'&&visitedIds.includes(place.id));return typeMatches&&statusMatches;}
  function draw(){layers.forEach(layer=>map.removeLayer(layer));layers=[];places.filter(isVisible).forEach(place=>{const marker=L.marker([place.lat,place.lng],{icon:icon(stateFor(place.id),place.category)}).addTo(map).bindPopup(popup(place));marker.on('popupopen',()=>loadMapPrice(place));layers.push(marker)});}
  window.zooAction=(id,action)=>{parent.postMessage({type:'zoo-action',id,action},'*');if(action==='wish'){wishes=wishes.includes(id)?wishes.filter(value=>value!==id):[...wishes,id];draw();}}
  window.addEventListener('message',(event)=>{if(event.data?.type!=='zoo-state')return;places=event.data.places||places;wishes=event.data.wishes||[];visitedIds=event.data.visitedIds||[];draw();});
  const filterShell=document.querySelector('.map-filter-shell'),filterStrip=document.querySelector('.map-filters'),previousFilters=document.querySelector('.map-filter-scroll.previous'),nextFilters=document.querySelector('.map-filter-scroll.next');
  L.DomEvent.disableClickPropagation(filterShell);L.DomEvent.disableScrollPropagation(filterShell);
  const updateFilterControls=()=>{const maximum=filterStrip.scrollWidth-filterStrip.clientWidth;previousFilters.disabled=filterStrip.scrollLeft<4;nextFilters.disabled=filterStrip.scrollLeft>maximum-4||maximum<=0;};
  const moveFilters=(direction)=>filterStrip.scrollBy({left:direction*Math.max(180,filterStrip.clientWidth*.72),behavior:'smooth'});
  previousFilters.addEventListener('click',()=>moveFilters(-1));nextFilters.addEventListener('click',()=>moveFilters(1));filterStrip.addEventListener('scroll',updateFilterControls,{passive:true});window.addEventListener('resize',updateFilterControls,{passive:true});
  document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{activeKind=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(item=>item.classList.toggle('active',item===button));button.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});draw();}));
  document.querySelectorAll('[data-status]').forEach(button=>button.addEventListener('click',()=>{activeStatus=activeStatus===button.dataset.status?'all':button.dataset.status;document.querySelectorAll('[data-status]').forEach(item=>item.classList.toggle('active',item.dataset.status===activeStatus));button.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});draw();}));
  requestAnimationFrame(updateFilterControls);
  draw();
</script></body></html>
